name: Self-test - lint runs on itself

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Run lint on self
        run: bash scripts/lint-no-absolute-paths.sh "$GITHUB_WORKSPACE"
